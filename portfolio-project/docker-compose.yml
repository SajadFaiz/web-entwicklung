services:
  database:
    image: postgres:18
    container_name: portfolio-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
    ports:
      - "5432:5432"
    volumes:
      - portfolio_database_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U portfolio -d portfolio
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: portfolio-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/portfolio
      DATABASE_USERNAME: portfolio
      DATABASE_PASSWORD: portfolio
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy

volumes:
  portfolio_database_data: