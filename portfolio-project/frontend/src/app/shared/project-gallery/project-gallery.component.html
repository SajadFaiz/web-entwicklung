<div class="gallery">
  <div class="gallery__thumbnails">
    @for (image of images(); track image; let index = $index) {
      <button
        type="button"
        class="gallery__thumbnail"
        [class.gallery__thumbnail--active]="selectedIndex() === index"
        (click)="selectImage(index)"
        [attr.aria-label]="'Show screenshot ' + (index + 1)"
      >
        <img
          [src]="image"
          [alt]="projectTitle() + ' screenshot thumbnail ' + (index + 1)"
        >
      </button>
    }
  </div>

  <div class="gallery__main">
    <button
      type="button"
      class="gallery__arrow gallery__arrow--left"
      (click)="previousImage()"
      aria-label="Previous screenshot"
    >
      ‹
    </button>

    <img
      [src]="images()[selectedIndex()]"
      [alt]="projectTitle() + ' screenshot ' + (selectedIndex() + 1)"
    >

    <button
      type="button"
      class="gallery__arrow gallery__arrow--right"
      (click)="nextImage()"
      aria-label="Next screenshot"
    >
      ›
    </button>
  </div>
</div>
